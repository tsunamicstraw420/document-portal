<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Template &amp; Sound Gallery</title>
<style>
:root{--bg:#07070c;--text:#f4f3fb;--muted:#a9a7c4;--line:rgba(255,255,255,.12);--v:#7c5cff;--tl:#12d0b4;--pk:#ff5ca8}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.aurora{position:fixed;inset:-20% -10% auto -10%;height:130%;z-index:0;filter:blur(80px);opacity:.8;pointer-events:none}
.blob{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite;will-change:transform}
.b1{width:46vw;height:46vw;left:-6vw;top:-8vw;background:radial-gradient(circle,var(--v),transparent 62%)}
.b2{width:42vw;height:42vw;right:-8vw;top:2vw;background:radial-gradient(circle,var(--tl),transparent 62%);animation-delay:-9s}
.b3{width:40vw;height:40vw;left:30vw;top:46vh;background:radial-gradient(circle,var(--pk),transparent 62%);animation-delay:-17s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vw,4vh) scale(1.1)}66%{transform:translate(-4vw,-3vh) scale(.94)}}
.wrap{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:22px 22px 80px}
header.bar{display:flex;align-items:center;gap:14px;padding:12px 16px;position:sticky;top:12px;z-index:20;flex-wrap:wrap;border-radius:20px;background:rgba(18,17,28,.6);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
.brand .dot{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--v),var(--tl),var(--pk),var(--v));box-shadow:0 0 18px rgba(124,92,255,.6)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;padding:7px 15px;border-radius:10px;font-size:13.5px;color:var(--muted);transition:.2s;white-space:nowrap}
.seg button.on{color:#fff;background:rgba(255,255,255,.14)}
.seg button.liked.on{background:rgba(255,92,168,.28)}
.search{flex:1;min-width:170px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.search input{all:unset;flex:1;color:#fff;font-size:14px}
.count{font-size:12.5px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:18px 2px 20px}
.chip{padding:6px 13px;border-radius:999px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;transition:.18s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.28)}
.chip.on{color:#0a0a12;background:linear-gradient(180deg,#fff,#d7d2ff);border-color:transparent;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px}
.card{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:rgba(24,22,38,.62);border:1px solid var(--line);box-shadow:0 8px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .2s ease,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#14121f}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb video{opacity:0;transition:opacity .3s}.card.hovv video{opacity:1}
.tl{position:absolute;left:13px;right:13px;bottom:11px;font-size:14px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.65);z-index:2}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;background:rgba(6,6,14,.25);z-index:1}
.card:hover .play{opacity:1}
.pbtn{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tag{position:absolute;top:11px;left:11px;font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;color:#fff;padding:4px 9px;border-radius:8px;background:rgba(6,6,14,.5);border:1px solid var(--line);z-index:2}
.tut{position:absolute;top:11px;right:52px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#fff;padding:5px 10px;border-radius:999px;background:rgba(124,92,255,.42);border:1px solid rgba(180,160,255,.6);z-index:3}
.like{position:absolute;top:10px;right:10px;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:rgba(6,6,14,.5);border:1px solid var(--line);cursor:pointer;z-index:5;opacity:.72;transition:.15s;padding:0}
.card:hover .like{opacity:1}
.like:hover{transform:scale(1.1)}
.like svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2}
.like.on{background:rgba(255,92,168,.92);border-color:rgba(255,160,196,.9);opacity:1}
.like.on svg{fill:#fff;stroke:#fff}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px 13px}
.cat{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10.5px;padding:3px 9px;border-radius:999px;color:#d8d4ff;background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.32);white-space:nowrap}
.snd .thumb{background:linear-gradient(160deg,#12121e,#1b1630)}
.snd canvas{width:100%;height:100%;display:block}
.snd.playing .pbtn{background:rgba(124,92,255,.55)}
.dur{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.liketools{display:none;gap:10px;align-items:center;margin:-4px 2px 18px;flex-wrap:wrap}
.ltbtn{all:unset;cursor:pointer;font-size:12.5px;color:var(--text);padding:7px 13px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.15s}
.ltbtn:hover{background:rgba(255,255,255,.12)}
.ltmsg{font-size:12px;color:var(--tl)}
.cpy{all:unset;cursor:pointer;font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.15s}
.cpy:hover{color:#fff;background:rgba(255,255,255,.1)}
.cpy.done{color:#0a0a12;background:#7ce6c8;border-color:transparent}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(18,17,28,.94);color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:14px;line-height:1.7}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(4,4,10,.82);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mbox{position:relative;width:min(92vw,1000px)}
.mbox video{width:100%;border-radius:14px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mtitle{margin:0 0 10px;font-size:15px;font-weight:600}
.mclose{position:absolute;top:-14px;right:-14px;width:38px;height:38px;border-radius:50%;background:#fff;color:#111;border:none;font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.mnote{margin-top:10px;font-size:12px;color:var(--muted)}
</style></head><body>

document.getElementById('btnExport').onclick=function(){const data={app:'cct-gallery',version:1,exportedAt:new Date().toISOString(),count:liked.size,likes:[...liked]};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gallery-likes.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);ltmsg('Exported '+liked.size+' like'+(liked.size==1?'':'s')+' to gallery-likes.json');};
document.getElementById('btnImport').onclick=function(){document.getElementById('importFile').click();};
document.getElementById('importFile').onchange=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(){try{const j=JSON.parse(r.result);const arr=Array.isArray(j)?j:(j.likes||[]);let added=0;arr.forEach(k=>{if(typeof k==='string'&&!liked.has(k)){liked.add(k);added++;}});saveLikes();updateLikedBtn();chips();apply();ltmsg('Imported — added '+added+', you now have '+liked.size);}catch(err){ltmsg('Could not read that file.');}};r.readAsText(f);e.target.value='';};
updateLikedBtn();chips();apply();
