<style>
/* Layout: one reading column. Airmail stripe, then "needs you", then every email in one sortable list. */
:root {
  --paper: #f5f7fa; --card: #ffffff; --ink: #172030; --muted: #5a6577; --line: #dce2eb;
  --accent: #2646b5; --stamp: #c4372c; --money: #1d7650; --chip: #e8edf5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f141b; --card: #161d27; --ink: #e5eaf1; --muted: #97a2b2; --line: #273141;
  --accent: #8fa7ff; --stamp: #ff7b6f; --money: #61d09c; --chip: #1f2835; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f141b; --card: #161d27; --ink: #e5eaf1; --muted: #97a2b2; --line: #273141;
  --accent: #8fa7ff; --stamp: #ff7b6f; --money: #61d09c; --chip: #1f2835; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 17px/1.55 var(--body); }
.stripe { height: 7px; background: repeating-linear-gradient(-45deg, var(--stamp) 0 12px, transparent 12px 24px, var(--accent) 24px 36px, transparent 36px 48px); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 36px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(30px, 6vw, 46px)/1.05 var(--display); margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font: 600 22px/1.2 var(--display); margin: 0; }
.lede { color: var(--muted); margin: 0; }
.lede b { color: var(--ink); font-weight: 600; }

.inboxes { display: flex; flex-wrap: wrap; gap: 8px; }
.inbox { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font: 600 15px/1.2 var(--body); cursor: pointer; }
.inbox span { font: 500 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.inbox[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.inbox[aria-pressed="true"] span { color: var(--paper); }
.inbox:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section { display: grid; gap: 14px; }
.needs { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.needs li { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--stamp); border-radius: 6px;
  padding: 12px 16px; display: grid; gap: 2px; }
.needs .what { font-weight: 600; }
.needs .meta { font: 13px/1.4 var(--mono); color: var(--muted); }
.needs a { color: inherit; text-decoration: none; }
.needs a:hover .what { text-decoration: underline; }
.empty { color: var(--muted); font-style: italic; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls input, .controls select { font: 16px var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 12px; }
.controls input { flex: 1 1 240px; min-width: 0; }
.count { font: 13px var(--mono); color: var(--muted); }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
/* Fixed columns: the narrow ones get set widths, Subject takes everything left over. */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
col.c-when { width: 170px; } col.c-from { width: 180px; } col.c-cat { width: 150px; }
th.when button { display: inline-block; padding-right: 4px; }
th.when button + button { padding-left: 4px; }
th { text-align: left; border-bottom: 1px solid var(--line); padding: 0; }
th button { all: unset; display: block; padding: 10px 12px; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; white-space: nowrap; }
th button[aria-sort]::after { content: " ↓"; }
th button[aria-sort="ascending"]::after { content: " ↑"; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
/* Time and inbox share one column, stacked, so Subject gets the room. */
td.when .time { display: block; font: 14px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
td.when .acct { display: block; margin-top: 2px; }
td.from { font-weight: 600; overflow-wrap: anywhere; }
td.subj a { color: var(--ink); text-decoration: none; font-weight: 600; }
td.subj a:hover { text-decoration: underline; }
td.subj p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.pill { display: inline-block; font: 500 12px/1 var(--mono); padding: 5px 8px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.action { background: var(--stamp); color: var(--card); }
.pill.money { color: var(--money); }
.acct { font: 13px var(--mono); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
footer { font: 13px/1.5 var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

/* Clickable rows and the email detail panel */
tbody tr[data-i], .needs li[data-id] { cursor: pointer; }
tbody tr[data-i]:hover td, .needs li[data-id]:hover { background: var(--chip); }
tbody tr:focus-visible, .needs li:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.subjtxt { font-weight: 600; }
dialog#detail { border: 0; padding: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(620px, 100%); max-width: 100%;
  background: var(--card); color: var(--ink); box-shadow: -12px 0 40px rgba(10, 16, 28, .25); }
dialog#detail::backdrop { background: rgba(10, 16, 28, .45); }
.dwrap { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
.dbar { display: flex; align-items: center; gap: 8px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 12px;
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.dbar .spacer { flex: 1; }
.dbtn { font: 600 15px var(--body); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.dbtn:disabled { opacity: .4; cursor: default; }
.dpos { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.dbody { overflow-y: auto; padding-block: 20px 24px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.dbody h3 { font: 600 24px/1.25 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.dmeta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.dmeta dt { font: 500 12px/1.9 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dmeta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dmeta .addr { font: 13px var(--mono); color: var(--muted); }
.dsum { font-weight: 600; margin: 0; padding: 12px 14px; background: var(--chip); border-radius: 6px; }
.dtext { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-width: 65ch; }
.dtext.thin { color: var(--muted); font-style: italic; }
.dfoot { padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
.dfoot a { font: 600 15px var(--body); color: var(--card); background: var(--accent); border-radius: 6px; padding: 9px 16px; text-decoration: none; }
@media (max-width: 640px) { dialog#detail { width: 100%; box-shadow: none; } }

@media (max-width: 1023px) {
  .tablebox { border: 0; background: none; overflow: visible; }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
  td { padding: 0; border: 0; }
  td.when { grid-column: 1; min-width: 0; } td.cat { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; }
  td.from { grid-column: 1 / -1; white-space: normal; } td.subj { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { .inbox, th button { transition: background .15s, color .15s; } }
</style>

<div class="stripe" aria-hidden="true"></div>
<main class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Morning mail · all inboxes</div>
    <h1 id="headline">Loading…</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="inboxes" id="inboxes" role="group" aria-label="Filter by inbox"></div>

  <section aria-labelledby="needs-h">
    <h2 id="needs-h">Needs you</h2>
    <ul class="needs" id="needs"></ul>
  </section>

  <section aria-labelledby="all-h">
    <h2 id="all-h">Every email</h2>
    <div class="controls">
      <input id="q" type="search" placeholder="Search sender, subject or summary" aria-label="Search emails">
      <select id="cat" aria-label="Filter by type"></select>
      <span class="count" id="count"></span>
    </div>
    <div class="tablebox">
      <table>
        <colgroup><col class="c-when"><col class="c-from"><col><col class="c-cat"></colgroup>
        <thead><tr>
          <th class="when"><button data-key="t" aria-sort="descending">Time</button><button data-key="acct">Inbox</button></th>
          <th><button data-key="from">From</button></th>
          <th><button data-key="subj">Subject</button></th>
          <th><button data-key="cat">Type</button></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<dialog id="detail" aria-labelledby="d-subj">
  <div class="dwrap">
    <div class="dbar">
      <button class="dbtn" id="d-prev" aria-label="Previous email">↑ Prev</button>
      <button class="dbtn" id="d-next" aria-label="Next email">↓ Next</button>
      <span class="dpos" id="d-pos"></span>
      <span class="spacer"></span>
      <button class="dbtn" id="d-close">Close</button>
    </div>
    <div class="dbody">
      <div><span class="pill" id="d-cat"></span></div>
      <h3 id="d-subj"></h3>
      <dl class="dmeta">
        <dt>From</dt><dd id="d-from"></dd>
        <dt>To</dt><dd id="d-to"></dd>
        <dt>Arrived</dt><dd id="d-time"></dd>
      </dl>
      <p class="dsum" id="d-sum"></p>
      <p class="dtext" id="d-text"></p>
    </div>
    <div class="dfoot"><a id="d-open" href="#" target="_blank" rel="noopener">Open in Gmail</a></div>
  </div>
</dialog>

<script>
(function () {
  const D = JSON.parse(document.getElementById("digest-data").textContent);
  const CATS = { action: "Needs you", money: "Money", updates: "Account updates", news: "Newsletters", promo: "Promotions" };
  const CAT_ORDER = ["action", "money", "updates", "news", "promo"];
  const HUB = "protocol7.inc@gmail.com";
  const acctName = Object.fromEntries(D.accounts.map(a => [a.id, a.name]));

  // A Gmail message ID starts with the time it arrived (milliseconds), so the page can show it without extra data.
  const arrived = id => Number(BigInt("0x" + id) >> 20n);
  const link = tid => "https://mail.google.com/mail/?authuser=" + HUB + "#all/thread-f:" + BigInt("0x" + tid).toString();
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "short", hour: "numeric", minute: "2-digit" });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const emails = D.emails.map(e => ({ ...e, t: arrived(e.id), acctName: acctName[e.acct] || e.acct }));
  let state = { acct: "all", q: "", cat: "all", key: "t", dir: -1 };

  document.getElementById("headline").textContent = D.headline;
  const nNeeds = D.needs.length;
  document.getElementById("lede").innerHTML =
    "<b>" + emails.length + " emails</b> across " + D.accounts.length + " inboxes in " + esc(D.window) + ". " +
    (nNeeds ? "<b>" + nNeeds + (nNeeds === 1 ? " thing needs" : " things need") + " you.</b>" : "Nothing needs you today.");
  document.getElementById("foot").innerHTML = "Built " + esc(D.generated) + ". " + (D.note ? esc(D.note) + " " : "") +
    "Everything forwards into " + HUB + ". Links open the email there.";

  const inboxes = document.getElementById("inboxes");
  function renderInboxes() {
    const counts = {}; emails.forEach(e => counts[e.acct] = (counts[e.acct] || 0) + 1);
    const items = [{ id: "all", name: "All inboxes", n: emails.length }].concat(D.accounts.map(a => ({ id: a.id, name: a.name, n: counts[a.id] || 0, title: a.address })));
    inboxes.innerHTML = items.map(a => '<button class="inbox" id="ib-' + a.id + '" data-acct="' + a.id + '" aria-pressed="' + (state.acct === a.id) + '"' +
      (a.title ? ' title="' + esc(a.title) + '"' : "") + ">" + esc(a.name) + " <span>" + a.n + "</span></button>").join("");
  }
  inboxes.addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; state.acct = b.dataset.acct; renderInboxes(); render(); });

  const needs = document.getElementById("needs");
  function renderNeeds() {
    const list = D.needs.filter(n => state.acct === "all" || n.acct === state.acct);
    needs.innerHTML = list.length ? list.map(n => '<li data-id="' + esc(n.id) + '" tabindex="0" role="button"><div class="what">' + esc(n.what) + "</div>" +
      (n.why ? "<div>" + esc(n.why) + "</div>" : "") + '<div class="meta">' + esc(acctName[n.acct] || n.acct) + " · " + fmt.format(arrived(n.id)) + "</div></li>").join("")
      : '<li class="empty" style="border-left-color:var(--line)">Nothing here needs you.</li>';
  }

  const sel = document.getElementById("cat");
  sel.innerHTML = '<option value="all">All types</option>' + CAT_ORDER.map(c => '<option value="' + c + '">' + CATS[c] + "</option>").join("");
  sel.addEventListener("change", () => { state.cat = sel.value; render(); });
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase(); render(); });

  document.querySelectorAll("th button").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.key;
    state.dir = state.key === k ? -state.dir : (k === "t" ? -1 : 1); state.key = k;
    document.querySelectorAll("th button").forEach(x => x.removeAttribute("aria-sort"));
    b.setAttribute("aria-sort", state.dir === 1 ? "ascending" : "descending");
    render();
  }));

  const rows = document.getElementById("rows");
  function render() {
    renderNeeds();
    let list = emails.filter(e => (state.acct === "all" || e.acct === state.acct) && (state.cat === "all" || e.cat === state.cat) &&
      (!state.q || (e.from + " " + e.subj + " " + e.sum).toLowerCase().includes(state.q)));
    const val = e => state.key === "cat" ? CAT_ORDER.indexOf(e.cat) : state.key === "acct" ? e.acctName.toLowerCase() : state.key === "t" ? e.t : String(e[state.key]).toLowerCase();
    list.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : b.t - a.t) * (val(a) === val(b) ? 1 : state.dir));
    current = list;
    rows.innerHTML = list.map((e, i) => '<tr data-i="' + i + '" tabindex="0" aria-label="Open email: ' + esc(e.subj) + '"><td class="when"><span class="time">' + fmt.format(e.t) + '</span><span class="acct">' + esc(e.acctName) + '</span>' +
      '</td><td class="from">' + esc(e.from) + '</td><td class="subj"><span class="subjtxt">' + esc(e.subj) +
      "</span><p>" + esc(e.sum) + '</p></td><td class="cat"><span class="pill ' + e.cat + '">' + CATS[e.cat] + "</span></td></tr>").join("") ||
      '<tr><td colspan="4" class="empty">No emails match.</td></tr>';
    document.getElementById("count").textContent = list.length + " of " + emails.length;
  }

  // Detail panel: click any row (or a "needs you" item) to read that email; Prev/Next walk the list as currently filtered and sorted.
  let current = [], pos = -1, list = [];
  const dlg = document.getElementById("detail");
  const $ = id => document.getElementById(id);
  const full = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const acctAddr = Object.fromEntries(D.accounts.map(a => [a.id, a.address]));
  function show(i) {
    pos = i; const e = list[i];
    $("d-cat").className = "pill " + e.cat; $("d-cat").textContent = CATS[e.cat];
    $("d-subj").textContent = e.subj;
    $("d-from").innerHTML = esc(e.from) + (e.addr ? '<br><span class="addr">' + esc(e.addr) + "</span>" : "");
    $("d-to").innerHTML = esc(e.acctName) + '<br><span class="addr">' + esc(acctAddr[e.acct] || "") + "</span>";
    $("d-time").textContent = full.format(e.t);
    $("d-sum").textContent = e.sum;
    const t = $("d-text");
    if (e.detail) { t.textContent = e.detail; t.className = "dtext"; }
    else { t.textContent = "No extra text saved for this email. Open it in Gmail to read all of it."; t.className = "dtext thin"; }
    $("d-open").href = link(e.tid);
    $("d-pos").textContent = (i + 1) + " of " + list.length;
    $("d-prev").disabled = i === 0; $("d-next").disabled = i === list.length - 1;
    dlg.querySelector(".dbody").scrollTop = 0;
  }
  function openList(l, i) { list = l; show(i); if (!dlg.open) dlg.showModal(); }
  rows.addEventListener("click", ev => { const tr = ev.target.closest("tr[data-i]"); if (tr) openList(current, +tr.dataset.i); });
  rows.addEventListener("keydown", ev => { const tr = ev.target.closest("tr[data-i]"); if (tr && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openList(current, +tr.dataset.i); } });
  function openNeed(li) {
    const id = li.dataset.id, i = current.findIndex(e => e.id === id);
    if (i >= 0) openList(current, i); else { const e = emails.find(x => x.id === id); if (e) openList([e], 0); }
  }
  needs.addEventListener("click", ev => { const li = ev.target.closest("li[data-id]"); if (li) openNeed(li); });
  needs.addEventListener("keydown", ev => { const li = ev.target.closest("li[data-id]"); if (li && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openNeed(li); } });
  $("d-prev").addEventListener("click", () => pos > 0 && show(pos - 1));
  $("d-next").addEventListener("click", () => pos < list.length - 1 && show(pos + 1));
  $("d-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.close(); });
  dlg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowDown" || ev.key === "j") { ev.preventDefault(); $("d-next").click(); }
    if (ev.key === "ArrowUp" || ev.key === "k") { ev.preventDefault(); $("d-prev").click(); }
  });
  renderInboxes(); render();
})();
</script>
