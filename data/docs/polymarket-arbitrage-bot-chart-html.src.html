<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bot Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { background: #0f1117; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { color: #fff; font-size: 22px; margin-bottom: 4px; }
  p  { color: #888; font-size: 13px; margin-bottom: 30px; }
  .chart-wrap { background: #1a1d27; border-radius: 16px; padding: 30px; width: 900px; max-width: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.4); }
  .stats { display: flex; gap: 24px; margin-top: 24px; }
  .stat { background: #22263a; border-radius: 10px; padding: 16px 24px; flex: 1; text-align: center; }
  .stat .val { font-size: 26px; font-weight: 700; }
  .stat .lbl { font-size: 12px; color: #888; margin-top: 4px; }
  .green { color: #4ade80; }
  .red   { color: #f87171; }
  .white { color: #fff; }
</style>
</head>
<body>
<h1>📈 Polymarket Arb Bot — Paper Performance</h1>
<p>Balance per hour since first run (starting $1,000 USDC)</p>
<div class="chart-wrap">
  <canvas id="chart" height="90"></canvas>
  <div class="stats">
    <div class="stat"><div class="val white" id="start">—</div><div class="lbl">Starting Balance</div></div>
    <div class="stat"><div class="val" id="current">—</div><div class="lbl">Current Balance</div></div>
    <div class="stat"><div class="val" id="peak">—</div><div class="lbl">Peak Balance</div></div>
    <div class="stat"><div class="val" id="pnl">—</div><div class="lbl">Total P&L</div></div>
    <div class="stat"><div class="val" id="pnlpct">—</div><div class="lbl">Return %</div></div>
  </div>
</div>
<script>
const raw = [
  ["Apr 5 11:00", 946.62],
  ["Apr 6 10:00", 1000.00],
  ["Apr 6 11:00", 1000.00],
  ["Apr 6 12:00", 1000.00],
  ["Apr 8 10:00", 1000.00],
  ["Apr 8 11:00", 1000.00],
  ["Apr 8 12:00", 1000.00],
  ["Apr 8 13:00", 1001.12],
  ["Apr 8 14:00", 1000.99],
  ["Apr 8 15:00", 1008.56],
  ["Apr 8 16:00", 1007.20],
  ["Apr 8 17:00", 1000.05],
  ["Apr 8 18:00", 1000.00],
  ["Apr 8 19:00", 1046.19],
  ["Apr 8 20:00", 1122.71],
  ["Apr 8 21:00", 1077.67],
  ["Apr 8 22:00", 1131.31],
  ["Apr 8 23:00", 1130.86],
  ["Apr 9 00:00", 1107.96],
  ["Apr 9 01:00", 1013.51],
  ["Apr 9 02:00", 1017.52],
  ["Apr 9 03:00", 1005.89],
  ["Apr 9 04:00", 1012.92],
  ["Apr 9 05:00", 1006.63],
  ["Apr 9 06:00", 1002.62],
  ["Apr 9 07:00", 1005.09],
  ["Apr 9 08:00", 1001.18],
  ["Apr 9 09:00", 1002.13],
  ["Apr 9 10:00", 1000.52],
];

const labels = raw.map(r => r[0]);
const data   = raw.map(r => r[1]);
const start  = 1000.00;
const current = data[data.length - 1];
const peak    = Math.max(...data);
const pnl     = current - start;
const pnlpct  = ((pnl / start) * 100).toFixed(2);

document.getElementById("start").textContent   = "$1,000.00";
document.getElementById("current").textContent = "$" + current.toFixed(2);
document.getElementById("current").className   = "val " + (current >= start ? "green" : "red");
document.getElementById("peak").textContent    = "$" + peak.toFixed(2);
document.getElementById("peak").className      = "val green";
document.getElementById("pnl").textContent     = (pnl >= 0 ? "+" : "") + "$" + pnl.toFixed(2);
document.getElementById("pnl").className       = "val " + (pnl >= 0 ? "green" : "red");
document.getElementById("pnlpct").textContent  = (pnl >= 0 ? "+" : "") + pnlpct + "%";
document.getElementById("pnlpct").className    = "val " + (pnl >= 0 ? "green" : "red");

// colour each point individually
const pointColors = data.map(v => v >= start ? "rgba(74,222,128,0.9)" : "rgba(248,113,113,0.9)");

const gradient = (ctx) => {
  const g = ctx.createLinearGradient(0, 0, 0, 400);
  g.addColorStop(0,   "rgba(74,222,128,0.25)");
  g.addColorStop(1,   "rgba(74,222,128,0.00)");
  return g;
};

new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "Balance (USDC)",
      data,
      borderColor: "#4ade80",
      borderWidth: 2.5,
      pointBackgroundColor: pointColors,
      pointRadius: 4,
      pointHoverRadius: 6,
      tension: 0.35,
      fill: true,
      backgroundColor: (ctx) => gradient(ctx.chart.ctx),
    }]
  },
  options: {
    responsive: true,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: "#1a1d27",
        borderColor: "#333",
        borderWidth: 1,
        titleColor: "#aaa",
        bodyColor: "#fff",
        callbacks: {
          label: ctx => " $" + ctx.parsed.y.toFixed(2) + " USDC"
        }
      }
    },
    scales: {
      x: {
        ticks: { color: "#666", maxRotation: 45, font: { size: 11 } },
        grid:  { color: "#1e2130" }
      },
      y: {
        ticks: {
          color: "#666",
          font: { size: 11 },
          callback: v => "$" + v.toFixed(0)
        },
        grid: { color: "#1e2130" }
      }
    }
  }
});
</script>
</body>
</html>
