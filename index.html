<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Document Portal — Eddie</title>
<style>
  :root{
    --bg:#0f1020; --panel:#17182b; --panel2:#1f2138; --ink:#e9e9f4; --muted:#a2a3c0;
    --line:#2c2e4a; --brand:#7c6cff; --brand2:#5ad1c4; --accent:#ffb454; --good:#4ade80;
    --chip:#25264a; --shadow:0 10px 30px rgba(0,0,0,.35); --radius:14px;
    --mark:#ffd54a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%,#26224a 0%,transparent 55%),
               radial-gradient(900px 500px at -10% 10%,#123a3a 0%,transparent 45%),
               var(--bg);
    color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  a{color:var(--brand2);text-decoration:none} a:hover{text-decoration:underline}

  /* header */
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(15,16,32,.96),rgba(15,16,32,.82));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 18px}
  .topinner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;color:#fff;font-size:16px}
  .searchwrap{flex:1;min-width:220px;position:relative}
  #search{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:11px 16px 11px 40px;font:15px/1.4 inherit}
  #search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
  .searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
  #searchclear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);
    cursor:pointer;font-size:18px;display:none}
  .countpill{color:var(--muted);font-size:13px;white-space:nowrap}

  /* layout */
  .layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px 18px 80px}
  aside{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
  .side-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand2);font-weight:800;margin:6px 4px 8px}
  .folderlist{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
  .folderlist button{display:flex;justify-content:space-between;gap:8px;align-items:center;background:none;border:none;
    color:var(--muted);text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;font:600 14px/1.3 inherit;width:100%}
  .folderlist button:hover{background:var(--panel);color:var(--ink)}
  .folderlist button.active{background:var(--brand);color:#fff}
  .folderlist .n{font-size:12px;opacity:.8;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 8px;min-width:26px;text-align:center}
  .folderlist button.active .n{background:rgba(255,255,255,.22)}
  .typechips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .typechips button{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:5px 11px;font:700 12px/1 inherit;cursor:pointer}
  .typechips button:hover{color:var(--ink)}
  .typechips button.active{background:var(--brand2);border-color:var(--brand2);color:#08201d}

  /* main */
  .mainhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 14px;flex-wrap:wrap}
  .mainhead h1{font-size:22px;margin:0}
  .mainhead .sub{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card:hover{border-color:var(--brand);transform:translateY(-2px)}
  .card .ct{display:flex;align-items:center;gap:8px}
  .badge{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .b-pdf{background:rgba(255,99,99,.16);color:#ff8f8f}
  .b-md{background:rgba(90,209,196,.16);color:var(--brand2)}
  .b-txt{background:rgba(162,163,192,.16);color:#c7c8e0}
  .b-html{background:rgba(124,108,255,.18);color:#b3a8ff}
  .b-csv{background:rgba(74,222,128,.16);color:#7ff0a6}
  .b-rtf,.b-doc,.b-docx{background:rgba(88,150,255,.18);color:#9cc0ff}
  .b-video{background:rgba(255,120,190,.18);color:#ff9dd0}
  .b-image{background:rgba(255,180,84,.18);color:var(--accent)}
  .card h3{font-size:15px;margin:0;line-height:1.3}
  .card .snip{color:var(--muted);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{color:var(--muted);font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;opacity:.85}
  .card .fol{font-size:11px;color:var(--brand2);font-weight:700}
  .card mark, .snip mark{background:var(--mark);color:#1a1400;border-radius:2px;padding:0 1px}
  .empty{color:var(--muted);padding:40px 10px;text-align:center}
  .grouphead{grid-column:1/-1;margin:18px 2px 2px;font-size:13px;font-weight:800;color:var(--brand2);
    letter-spacing:.04em;display:flex;align-items:center;gap:10px}
  .grouphead::after{content:"";flex:1;height:1px;background:var(--line)}

  /* reader overlay */
  .reader{position:fixed;inset:0;z-index:60;background:rgba(6,7,16,.72);backdrop-filter:blur(4px);display:none}
  .reader.open{display:block}
  .rpanel{position:absolute;right:0;top:0;height:100%;width:min(920px,100%);background:var(--bg);
    border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:slidein .22s ease}
  @keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  .rhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
  .rtop{display:flex;align-items:center;gap:10px}
  .rtop .rback{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;font:700 13px/1 inherit}
  .rtop .rback:hover{border-color:var(--brand)}
  .rtitle{font-size:16px;font-weight:800;flex:1;min-width:0}
  .rmeta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
  .rmeta .path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;opacity:.8;word-break:break-all}
  .rtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rtools button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 11px;cursor:pointer;font:700 12px/1 inherit}
  .rtools button:hover{color:var(--ink);border-color:var(--brand)}
  .rtools button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .findbar{display:none;align-items:center;gap:8px;flex-wrap:wrap}
  .findbar.show{display:flex}
  .findbar input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:14px/1.3 inherit;min-width:160px}
  .findbar input:focus{outline:none;border-color:var(--brand)}
  .findbar .fcount{color:var(--muted);font-size:12px;min-width:52px}
  .findbar .fnav{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;width:30px;height:30px;cursor:pointer}
  .findbar .fnav:hover{border-color:var(--brand)}
  .rbody{flex:1;overflow:auto;padding:22px 26px;scroll-behavior:smooth}
  .rbody.pdfmode{padding:14px;background:#0a0b16}
  #readerContent{max-width:820px;margin:0 auto}
  .rbody.pdfmode #readerContent{max-width:1000px}

  /* content styles */
  #readerContent h1{font-size:26px;margin:.2em 0 .4em} #readerContent h2{font-size:21px;margin:1em 0 .3em;color:#fff}
  #readerContent h3{font-size:17px;margin:.9em 0 .3em} #readerContent h4{font-size:15px;margin:.8em 0 .2em;color:var(--brand2)}
  #readerContent p{margin:.5em 0} #readerContent ul,#readerContent ol{margin:.5em 0 .8em 1.3em;padding:0}
  #readerContent li{margin:.25em 0}
  #readerContent a{color:var(--brand2)} #readerContent hr{border:none;border-top:1px solid var(--line);margin:1.4em 0}
  #readerContent code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
  #readerContent pre.code{background:#0b0c17;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto}
  #readerContent pre.code code{background:none;border:none;padding:0;font-size:13px;line-height:1.5}
  #readerContent blockquote{border-left:3px solid var(--brand);margin:.8em 0;padding:.2em 0 .2em 14px;color:var(--muted)}
  #readerContent table{width:100%;border-collapse:collapse;margin:1em 0;font-size:13.5px;display:block;overflow-x:auto}
  #readerContent th,#readerContent td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  #readerContent th{background:var(--panel);color:var(--brand2)}
  #readerContent pre.txtdoc{white-space:pre-wrap;word-wrap:break-word;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  #readerContent .richdoc{background:#fff;color:#111;border-radius:10px;padding:22px 26px}
  #readerContent .richdoc a{color:#2b5fd9}
  #readerContent .pdfpages{display:flex;flex-direction:column;gap:12px;align-items:center}
  #readerContent img.pdfpage{width:100%;max-width:900px;border:1px solid var(--line);border-radius:6px;background:#fff}
  #readerContent .pdftext pre{white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  #readerContent iframe.htmlframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
  #readerContent .mediawrap{display:flex;justify-content:center}
  #readerContent video.vid{width:100%;max-width:900px;border-radius:12px;border:1px solid var(--line);background:#000}
  #readerContent img.imgdoc{max-width:100%;border-radius:10px;border:1px solid var(--line)}
  #readerContent mark.find{background:var(--mark);color:#1a1400;border-radius:2px}
  #readerContent mark.find.active{background:#ff8a3d;color:#160a00;box-shadow:0 0 0 2px rgba(255,138,61,.4)}

  .loadhint{color:var(--muted);font-size:13px;padding:8px 2px}
  .footer{max-width:1280px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:12px}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:14px 12px 60px}
    aside{position:static;max-height:none;overflow:visible;margin-bottom:6px}
    .folderlist{flex-direction:row;flex-wrap:wrap} .folderlist button{width:auto}
    .folderlist .n{margin-left:6px}
    .rbody{padding:16px 16px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="topinner">
    <div class="brand"><span class="logo">📚</span><span>Document&nbsp;Portal</span></div>
    <div class="searchwrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search all documents…  (press /)" autocomplete="off" />
      <button id="searchclear" title="Clear">×</button>
    </div>
    <div class="countpill" id="countpill">…</div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="side-h">Folders</div>
    <div class="folderlist" id="folderlist"></div>
    <div class="side-h">Types</div>
    <div class="typechips" id="typechips"></div>
  </aside>
  <main>
    <div class="mainhead">
      <h1 id="viewtitle">All documents</h1>
      <div class="sub" id="viewsub"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No documents match.</div>
  </main>
</div>
<div class="footer" id="footer"></div>

<!-- Reader -->
<div class="reader" id="reader">
  <div class="rpanel">
    <div class="rhead">
      <div class="rtop">
        <button class="rback" id="rback">← Back</button>
        <div class="rtitle" id="rtitle"></div>
      </div>
      <div class="rmeta" id="rmeta"></div>
      <div class="rtools">
        <button id="findtoggle">🔍 Find in document</button>
        <span id="pdftabs" style="display:none">
          <button id="tabpages" class="on">Pages</button>
          <button id="tabtext">Text</button>
        </span>
        <div class="findbar" id="findbar">
          <input id="findinput" type="text" placeholder="Find…" autocomplete="off">
          <span class="fcount" id="fcount">0 / 0</span>
          <button class="fnav" id="fprev" title="Previous">↑</button>
          <button class="fnav" id="fnext" title="Next">↓</button>
        </div>
      </div>
    </div>
    <div class="rbody" id="rbody"><div id="readerContent"></div></div>
  </div>
</div>

<script>
const TYPE_LABELS={pdf:"PDF",md:"Markdown",txt:"Text",html:"Web page",csv:"Spreadsheet",
  rtf:"Doc",doc:"Doc",docx:"Doc",video:"Video",image:"Image"};
let INDEX=null, SEARCH=null, searchLoading=null;
let activeFolder="__all", activeType="__all", query="";
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtDate=ts=>{const d=new Date(ts*1000);return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});};
const fmtSize=b=>b>=1e6?(b/1e6).toFixed(1)+' MB':b>=1e3?Math.round(b/1e3)+' KB':b+' B';

async function boot(){
  INDEX=await (await fetch('data/index.json')).json();
  $('#countpill').textContent=INDEX.count+' documents';
  $('#footer').innerHTML='<b>'+INDEX.count+'</b> documents across <b>'+INDEX.folders.length+
    '</b> folders · converted for in-browser reading &amp; full-text search · secrets and personal files excluded.';
  renderFolders(); renderTypes(); render();
  // deep link
  const h=location.hash.slice(1);
  if(h){const d=INDEX.docs.find(x=>x.id===h); if(d) openDoc(d);}
}

function renderFolders(){
  const box=$('#folderlist'); box.innerHTML='';
  const mk=(key,label,n)=>{const b=el('button');if(key===activeFolder)b.classList.add('active');
    b.innerHTML='<span>'+esc(label)+'</span><span class="n">'+n+'</span>';
    b.onclick=()=>{activeFolder=key;renderFolders();render();window.scrollTo(0,0);};box.appendChild(b);};
  mk('__all','All folders',INDEX.count);
  INDEX.folders.forEach(f=>mk(f.key,f.label,f.count));
}
function renderTypes(){
  const box=$('#typechips'); box.innerHTML='';
  const types={}; INDEX.docs.forEach(d=>types[d.type]=(types[d.type]||0)+1);
  const mk=(key,label)=>{const b=el('button');if(key===activeType)b.classList.add('active');
    b.textContent=label;b.onclick=()=>{activeType=key;renderTypes();render();};box.appendChild(b);};
  mk('__all','All');
  Object.keys(types).sort((a,b)=>types[b]-types[a]).forEach(t=>mk(t,(TYPE_LABELS[t]||t)+' ·'+types[t]));
}

function baseFilter(d){
  if(activeFolder!=='__all' && d.folder!==activeFolder) return false;
  if(activeType!=='__all' && d.type!==activeType) return false;
  return true;
}

async function ensureSearch(){
  if(SEARCH) return SEARCH;
  if(!searchLoading){ searchLoading=fetch('data/search.json').then(r=>r.json()).then(j=>SEARCH=j); }
  return searchLoading;
}

function highlight(text,terms){
  let out=esc(text);
  terms.forEach(t=>{ if(!t)return;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    out=out.replace(re,'<mark>$1</mark>'); });
  return out;
}
function snippetFor(txt,terms){
  const low=txt.toLowerCase(); let pos=-1;
  for(const t of terms){const p=low.indexOf(t); if(p>=0&&(pos<0||p<pos))pos=p;}
  if(pos<0) return esc(txt.slice(0,240));
  const start=Math.max(0,pos-70); const seg=(start>0?'…':'')+txt.slice(start,start+260)+'…';
  return highlight(seg,terms);
}

async function render(){
  const grid=$('#grid'); const q=query.trim().toLowerCase();
  const terms=q?q.split(/\s+/).filter(Boolean):[];
  let list;
  if(terms.length){
    $('#viewtitle').textContent='Search results';
    $('#grid').innerHTML='<div class="loadhint">Searching…</div>';
    await ensureSearch();
    const scored=[];
    for(const d of INDEX.docs){
      if(!baseFilter(d)) continue;
      const hay=(SEARCH[d.id]||(d.title+' '+d.snippet).toLowerCase());
      const title=d.title.toLowerCase();
      let score=0, ok=true;
      for(const t of terms){
        const inT=title.includes(t), inB=hay.includes(t);
        if(!inT&&!inB){ok=false;break;}
        score+=(inT?8:0)+(inB?1:0);
        score+=(hay.split(t).length-1)*0.2;
      }
      if(ok) scored.push([score,d]);
    }
    scored.sort((a,b)=>b[0]-a[0]);
    list=scored.map(x=>x[1]);
    $('#viewsub').textContent=list.length+' match'+(list.length===1?'':'es')+' for “'+query.trim()+'”';
  } else {
    const f=INDEX.folders.find(x=>x.key===activeFolder);
    $('#viewtitle').textContent=activeFolder==='__all'?'All documents':(f?f.label:activeFolder);
    list=INDEX.docs.filter(baseFilter);
    $('#viewsub').textContent=list.length+' document'+(list.length===1?'':'s')+
      (activeType!=='__all'?' · '+(TYPE_LABELS[activeType]||activeType):'');
  }
  grid.innerHTML='';
  if(!list.length){$('#empty').style.display='';return;} $('#empty').style.display='none';

  let curFolder=null;
  const grouping=(!terms.length && activeFolder==='__all');
  list.forEach(d=>{
    if(grouping && d.folderLabel!==curFolder){
      curFolder=d.folderLabel; const gh=el('div','grouphead'); gh.textContent=curFolder; grid.appendChild(gh);
    }
    grid.appendChild(card(d,terms));
  });
}

function card(d,terms){
  const c=el('div','card'); c.onclick=()=>openDoc(d);
  const badge='<span class="badge b-'+d.type+'">'+(TYPE_LABELS[d.type]||d.type)+'</span>';
  const meta=[];
  if(d.pages) meta.push(d.pages+' pg');
  if(d.words) meta.push(d.words.toLocaleString()+' words');
  meta.push(fmtSize(d.size)); meta.push(fmtDate(d.mtime));
  const titleH=terms&&terms.length?highlight(d.title,terms):esc(d.title);
  const snip=d.type==='image'||d.type==='video'?'':
    '<div class="snip">'+(terms&&terms.length?snippetFor((SEARCH&&SEARCH[d.id])||d.snippet,terms):esc(d.snippet))+'</div>';
  c.innerHTML='<div class="ct">'+badge+'<span class="fol">'+esc(d.folderLabel)+'</span></div>'+
    '<h3>'+titleH+'</h3>'+snip+
    '<div class="meta">'+meta.map(m=>'<span>'+m+'</span>').join('')+'</div>';
  return c;
}

/* ---------- reader ---------- */
let curDoc=null;
async function openDoc(d){
  curDoc=d; clearFind();
  $('#findbar').classList.remove('show'); $('#findtoggle').classList.remove('on'); $('#findinput').value='';
  $('#rtitle').textContent=d.title;
  const meta=[]; meta.push('<span class="badge b-'+d.type+'">'+(TYPE_LABELS[d.type]||d.type)+'</span>');
  meta.push('<span>'+esc(d.folderLabel)+'</span>');
  if(d.pages)meta.push('<span>'+d.pages+' pages</span>');
  if(d.words)meta.push('<span>'+d.words.toLocaleString()+' words</span>');
  meta.push('<span>'+fmtSize(d.size)+'</span>');
  meta.push('<span class="path">'+esc((d.sub?d.sub+'/':'')+'')+'</span>');
  $('#rmeta').innerHTML=meta.join('');
  const rc=$('#readerContent'); rc.innerHTML='<div class="loadhint">Loading…</div>';
  $('#rbody').classList.toggle('pdfmode',d.type==='pdf');
  const reader=$('#reader'); reader.classList.add('open'); document.body.style.overflow='hidden';
  history.replaceState(null,'','#'+d.id);
  try{
    const html=await (await fetch('data/docs/'+d.id+'.html')).text();
    rc.innerHTML=html;
  }catch(e){ rc.innerHTML='<div class="loadhint">Could not load this document.</div>'; }
  // pdf tabs
  const hasPdf=rc.querySelector('.pdfpages'), hasTxt=rc.querySelector('.pdftext');
  $('#pdftabs').style.display=(hasPdf&&hasTxt)?'':'none';
  if(hasPdf&&hasTxt){ setPdfTab('pages'); }
  $('#rbody').scrollTop=0;
}
function closeReader(){ $('#reader').classList.remove('open'); document.body.style.overflow='';
  history.replaceState(null,'',location.pathname+location.search); curDoc=null; clearFind(); }
$('#rback').onclick=closeReader;
$('#reader').addEventListener('click',e=>{ if(e.target.id==='reader') closeReader(); });

function setPdfTab(which){
  const rc=$('#readerContent'); const pages=rc.querySelector('.pdfpages'), txt=rc.querySelector('.pdftext');
  if(!pages||!txt)return;
  if(which==='text'){pages.setAttribute('hidden','');txt.removeAttribute('hidden');
    $('#tabtext').classList.add('on');$('#tabpages').classList.remove('on');}
  else{txt.setAttribute('hidden','');pages.removeAttribute('hidden');
    $('#tabpages').classList.add('on');$('#tabtext').classList.remove('on');}
}
$('#tabpages').onclick=()=>{setPdfTab('pages');clearFind();};
$('#tabtext').onclick=()=>setPdfTab('text');

/* ---------- find in document ---------- */
let findMatches=[], findIdx=-1;
$('#findtoggle').onclick=()=>{
  const fb=$('#findbar'); const showing=fb.classList.toggle('show');
  $('#findtoggle').classList.toggle('on',showing);
  if(showing){ // pdf: switch to text tab so matches are visible
    if(curDoc&&curDoc.type==='pdf') setPdfTab('text');
    $('#findinput').focus();
  } else clearFind();
};
$('#findinput').addEventListener('input',()=>runFind($('#findinput').value));
$('#findinput').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); e.shiftKey?navFind(-1):navFind(1);} });
$('#fnext').onclick=()=>navFind(1); $('#fprev').onclick=()=>navFind(-1);

function clearFind(){
  const rc=$('#readerContent');
  rc.querySelectorAll('mark.find').forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});
  findMatches=[];findIdx=-1;$('#fcount').textContent='0 / 0';
}
function runFind(term){
  clearFind(); term=term.trim(); if(term.length<2){return;}
  const rc=$('#readerContent');
  const scope=rc.querySelector('.pdftext:not([hidden])')||rc;
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
  const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,{
    acceptNode:n=>{ if(!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
      const p=n.parentNode; if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;}});
  const nodes=[]; let n; while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{
    const txt=node.nodeValue; let m,last=0,frag=null;
    re.lastIndex=0;
    while(m=re.exec(txt)){
      if(!frag)frag=document.createDocumentFragment();
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const mk=el('mark','find');mk.textContent=m[0];frag.appendChild(mk);findMatches.push(mk);
      last=m.index+m[0].length; if(m[0].length===0)re.lastIndex++;
    }
    if(frag){ if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
      node.parentNode.replaceChild(frag,node); }
  });
  if(findMatches.length){findIdx=0;setActive();}
  $('#fcount').textContent=(findMatches.length?1:0)+' / '+findMatches.length;
}
function navFind(dir){ if(!findMatches.length)return;
  findMatches[findIdx]&&findMatches[findIdx].classList.remove('active');
  findIdx=(findIdx+dir+findMatches.length)%findMatches.length; setActive(); }
function setActive(){ const m=findMatches[findIdx]; if(!m)return;
  findMatches.forEach(x=>x.classList.remove('active')); m.classList.add('active');
  m.scrollIntoView({block:'center',behavior:'smooth'});
  $('#fcount').textContent=(findIdx+1)+' / '+findMatches.length; }

/* ---------- search box ---------- */
let deb;
$('#search').addEventListener('input',e=>{ query=e.target.value;
  $('#searchclear').style.display=query?'':'none';
  clearTimeout(deb); deb=setTimeout(render,180); });
$('#searchclear').onclick=()=>{ query='';$('#search').value='';$('#searchclear').style.display='none';render();$('#search').focus(); };
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#search').focus();}
  if(e.key==='Escape'){ if($('#reader').classList.contains('open'))closeReader(); }
});

boot();
</script>
</body>
